<footer th:fragment="footer">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <!-- Suivi Batch Omicron -->
    <script>
        function chargerStatutBatch() {
            fetch('/api/batch/status')
            .then(response => response.json())
            .then(data => {
                let etat = document.getElementById("batchEtat");
                let etape = document.getElementById("batchEtape");
                let progress = document.getElementById("batchProgress");
                // Si la page n'a pas les éléments
                // on ne fait rien
                if(!etat) {
                    return;
                }
                if(data.enCours){
                    etat.innerHTML="En cours";
                    etat.className="badge bg-warning";
                }
                else if(data.fin != null){
                    etat.innerHTML="Terminé";
                    etat.className="badge bg-success";
                }
                else {
                    etat.innerHTML="Repos";
                    etat.className="badge bg-secondary";
                }
                etape.innerHTML =
                    data.etapeActuelle ?? "-";
                progress.style.width =
                    data.pourcentage + "%";
                progress.innerHTML =
                    data.pourcentage + "%";
            });
        }
        // Actualisation toutes les 2 secondes
        setInterval(chargerStatutBatch,2000);
        chargerStatutBatch();

		    fetch('/api/roster/status')

		        let etat =

		        if(data.enCours){

		        }
		        else {
		            etat.innerHTML="Repos";
		            etat.className="badge bg-secondary";
		        }
		        etape.innerHTML =
		            data.etapeActuelle ?? "-";
		        progress.style.width =
		            data.pourcentage + "%";
		        progress.innerHTML =
		            data.pourcentage + "%";

		}
		
		function chargerStatutGuilde() {

			    .then(data => {
			        let etat =
			            document.getElementById("guildeEtat");
			        let etape =

			        let progress =

			        if(!etat){

			        else if(data.fin != null){

			        else {
			            etat.innerHTML="Repos";
			            etat.className="badge bg-secondary";

			        etape.innerHTML =

			        progress.style.width =

		setInterval(chargerStatutGuilde,2000);
		chargerStatutGuilde();

		setInterval(chargerStatutRoster,2000);
		chargerStatutRoster();
		
		document.getElementById("personnageSelect")
		.addEventListener("change", function() {

		    let option = this.options[this.selectedIndex];

		    document.getElementById("baseId").value = this.value;
		    document.getElementById("nom").value = option.dataset.nom;

		});
		
		function mettreNomPersonnage(select) {
		    let nom = select.options[select.selectedIndex].text;
		    document.getElementById("nom").value = nom;
		}
		
		function ouvrirComparatif(button){
		    const id = button.dataset.id;
		    fetch("/objectifs/" + id + "/comparatif")
		        .then(response => response.text())
		        .then(html => {
		            document.getElementById("contenuComparatif").innerHTML = html;
		            const modal = new bootstrap.Modal(
		                document.getElementById("comparatifModal")
		            );
		            modal.show();
		        });
		}
		
		function chargerComparatif(nom) {

		    fetch('/objectifs/' + encodeURIComponent(nom) + '/comparatif')
		        .then(response => response.text())
		        .then(html => {
		            document.getElementById("comparatifContent").innerHTML = html;

		            new bootstrap.Modal(
		                document.getElementById("comparatifModal")
		            ).show();
		        });
		}
    </script>
	<script th:src="@{/js/comparatif.js}"></script>

</footer>
