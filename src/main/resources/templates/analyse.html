<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="app-page">
<div th:replace="~{fragments/menu :: menu}"></div>
<main class="app-container">
    <header class="app-page-header">
        <div class="app-page-heading">
            <span class="app-kicker">Recrutement</span>
            <h1><i class="bi bi-person-plus-fill me-2"></i>Analyse joueur</h1>
            <p>Analyse un candidat externe à partir de son Ally Code.</p>
        </div>
        <div class="app-header-actions"><button id="themeToggle" class="app-theme-toggle" type="button"><i class="bi bi-moon-stars-fill"></i><span>Mode sombre</span></button></div>
    </header>
    <section class="app-card">
        <div class="app-empty">
            <div class="app-empty-icon"><i class="bi bi-person-bounding-box"></i></div>
            <h3>Analyse de candidat</h3>
            <p>La page est maintenant harmonisée avec le reste de l'application et prête à recevoir la future analyse par Ally Code.</p>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
