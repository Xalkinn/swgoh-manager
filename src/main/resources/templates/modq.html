<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}">

</head>

<body>

<!-- MENU -->
<div th:replace="~{fragments/menu :: menu}"></div>
<!-- ONGLET -->
	<div class="container mt-5">
	
	    <h1>
	        Qualité des mods
	    </h1>
	
	    <div class="card text-center mt-4">
	
	        <div class="card-header">
	
	            <ul class="nav nav-pills card-header-pills">
	
	                <li class="nav-item">
	                    <a class="nav-link"
	                       th:classappend="${onglet == 'stats' ? '' : 'active'}"
	                       href="/mods">
	                        Qualité des mods
	                    </a>
	                </li>
	
	                <li class="nav-item">
	                    <a class="nav-link"
	                       th:classappend="${onglet == 'stats' ? 'active' : ''}"
	                       href="/mods?onglet=stats">
	                        Statistiques
	                    </a>
	                </li>
	
	            </ul>
	
	        </div>
								
	        <div class="card-body">
	
	            <!-- ========================= -->
	            <!-- CLASSEMENT -->
	            <!-- ========================= -->
	
				<div th:if="${onglet != 'stats'}">
												
                <h5 class="card-title">
                    Classement ModQ
                </h5>
				<div class="mb-3">
				    <a href="/actions/maj-modq"
				       class="btn btn-primary">
				    	<i class="bi bi-arrow-repeat"></i> Actualiser les données
				    </a>
				</div>
				<div class="mt-3">

				    <span id="modsEtat"
				          class="badge bg-secondary">
				        Repos
				    </span>

				    <div id="modsEtape" class="mt-2">
				        -
				    </div>
						<div class="mb-4">
						    <div class="progress mt-2">
						        <div id="modsProgress" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%">
						            0%
						        </div>
						</div>
				    </div>

				</div>
                <table id="tableauModQ" class="styled-table">

                    <thead>

                    <tr>
                        <th onclick="trierTableauModQ(0)">Rang ↕</th>
                        <th onclick="trierTableauModQ(1)">Joueur ↕</th>
                        <th onclick="trierTableauModQ(2)">Mods 15-19 ↕</th>
                        <th onclick="trierTableauModQ(3)">Mods 20-24 ↕</th>
                        <th onclick="trierTableauModQ(4)">Mods 25+ ↕</th>
                        <th onclick="trierTableauModQ(5)">ModQ ↕</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="m, stat : ${modq}">

                        <td th:text="${stat.index + 1}"></td>

                        <td th:text="${m.joueur}"></td>

                        <td th:text="${m.nb15_19}"></td>

                        <td th:text="${m.nb20_24}"></td>

                        <td th:text="${m.nb25}"></td>

                        <td th:text="${#numbers.formatDecimal(m.modQ,1,2)}"></td>

                    </tr>

                    </tbody>

                </table>

            </div>

	            <!-- ========================= -->
	            <!-- STATISTIQUES -->
	            <!-- ========================= -->
	
	            <div th:if="${onglet == 'stats'}">
	
	                <h5 class="card-title">
	                    Statistiques des mods
	                </h5>
	
	                <p class="text-muted">
	                    À venir...
	                </p>
	
	            </div>
	
	        </div>
	
	    </div>
	
	</div>

<div class="container">

    <h1 class="page-title">Classement ModQ</h1>

    <table id="tableauModQ" class="styled-table">

        <thead>
        <tr>
			<th onclick="trierTableauModQ(0)">Rang ↕</th>
		    <th onclick="trierTableauModQ(1)">Joueur ↕</th>
		    <th onclick="trierTableauModQ(2)">Mods 15-19 ↕</th>
		    <th onclick="trierTableauModQ(3)">Mods 20-24 ↕</th>
		    <th onclick="trierTableauModQ(4)">Mods 25+ ↕</th>
		    <th onclick="trierTableauModQ(5)">ModQ ↕</th>
        </tr>
        </thead>


        <tbody>

        <tr th:each="m, stat : ${modq}">

            <td th:text="${stat.index + 1}"></td>

            <td th:text="${m.joueur}"></td>

            <td class="number" th:text="${m.nb15_19}"></td>

            <td class="number" th:text="${m.nb20_24}"></td>

            <td class="number" th:text="${m.nb25}"></td>

            <td class="modq" th:text="${#numbers.formatDecimal(m.modQ,1,2)}"></td>

        </tr>

        </tbody>

    </table>

</div>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>


</body>
</html>
