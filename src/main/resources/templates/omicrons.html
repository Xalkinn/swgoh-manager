<!DOCTYPE html>
<html lang="fr"
xmlns:th="http://www.thymeleaf.org">


<head>
<title>Omicrons</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>

<body>
	<!-- MENU -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	    <div class="container-fluid">
	        <a class="navbar-brand" href="/">
	            ⭐ SWGOH Manager
	        </a>
	        <div class="navbar-nav">
	            <a class="nav-link active" href="/">
	                Accueil
	            </a>
	            <a class="nav-link" href="/omicrons">
	                Omicrons
	            </a>
	            <a class="nav-link" href="/joueurs">
	                Joueurs
	            </a>
	        </div>
	    </div>
	</nav>
	<div class="container mt-5">
		<h1>
		Liste des Omicrons
		</h1>
	<table class="table table-striped">
		<tr>
			<th>Joueur</th>
			<th>Personnage</th>
			<th>Type</th>
			<th>Actif</th>
		</tr>
		<tr th:each="o : ${omicrons}">
			<td th:text="${o.nomJoueur}"></td>
			<td th:text="${o.personnage}"></td>
			<td th:text="${o.typeCapacite}"></td>
			<td th:text="${o.actif ? 'Oui':'Non'}"></td>
		</tr>
		</table>
	</div>
</body>

</html>
